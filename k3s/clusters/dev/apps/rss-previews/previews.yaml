apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rss-previews
  namespace: rss-preview
spec:
  serviceAccountName: rss-previews
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: rss-prs
  resourcesTemplate: |
    <<- if eq inputs.author "kveeti" >>
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: rss-pr-<< inputs.id >>
      namespace: rss-preview
      labels:
        app.kubernetes.io/part-of: rss-previews
      annotations:
        event.toolkit.fluxcd.io/change_request: << inputs.id | quote >>
        event.toolkit.fluxcd.io/commit: << inputs.sha | quote >>
        event.toolkit.fluxcd.io/preview-url: https://rss-pr-<< inputs.id >>.preview.veetik.com
    spec:
      serviceAccountName: rss-previews
      interval: 5m
      retryInterval: 1m
      timeout: 10m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: ./k3s/clusters/dev/apps/rss-previews/app
      targetNamespace: rss-preview
      prune: true
      wait: true
      postBuild:
        substitute:
          PREVIEW_PR: << inputs.id | quote >>
          PREVIEW_SHA: << inputs.sha | quote >>
          quote: '"'
    <<- end >>
