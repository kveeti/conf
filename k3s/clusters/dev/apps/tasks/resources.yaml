apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-config
  namespace: tasks
data:
  FRONT_URL: https://tasks.internal.veetik.com
  .env: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-backend
  namespace: tasks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks-backend
  template:
    metadata:
      labels:
        app: tasks-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tasks-backend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: docker.io/veetik/tasks@sha256:902c63258c27a60bd911ab4d6360bba7f96714e4076a7800bd9d92b7fbeb3d4c
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tasks-secrets
          env:
            - name: FRONT_URL
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: FRONT_URL
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: tasks-db-app
                  key: fqdn-uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full&sslrootcert=/etc/tasks/ca.crt
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: env-file
              mountPath: /.env
              subPath: .env
              readOnly: true
            - name: db-ca
              mountPath: /etc/tasks
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: env-file
          configMap:
            name: tasks-config
            items:
              - key: .env
                path: .env
        - name: db-ca
          secret:
            secretName: tasks-db-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-backend
  namespace: tasks
spec:
  selector:
    app: tasks-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-frontend
  namespace: tasks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks-frontend
  template:
    metadata:
      labels:
        app: tasks-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tasks-frontend
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: docker.io/veetik/tasks@sha256:ba34265a63bb952f89c3952a8d8d6e6ed1e8cd72e91745b0eb0bc12d4359f46e
          imagePullPolicy: Always
          env:
            - name: PUBLIC_API_URL
              value: https://tasks.internal.veetik.com
            - name: PUBLIC_VAPID_PUBLIC_KEY
              value: BMvRTtdBaxw8nWOkVbBOH_mC7sPHTkgVbbtrYqEek05-iupcxgkLUksERHvFsBIE5xytDaNzxeuLHTLu8FC-O-k
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-frontend
  namespace: tasks
spec:
  selector:
    app: tasks-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tasks
  namespace: tasks
spec:
  parentRefs:
    - name: internal-gateway
      namespace: internal-ingress
      sectionName: websecure
  hostnames:
    - tasks.internal.veetik.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: tasks-backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tasks-frontend
          port: 80
