apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: radicale-restore
  namespace: radicale
spec:
  trigger:
    manual: mutual-chap-migration-restore
  restic:
    repository: radicale-restic-config
    moverServiceAccount: radicale-backup
    moverPodLabels:
      app.kubernetes.io/component: backup
    copyMethod: Snapshot
    capacity: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: storage-iscsi-mutual-chap
    volumeSnapshotClassName: storage-iscsi-mutual-chap
    cleanupTempPVC: true
    cleanupCachePVC: true
    cacheStorageClassName: local-path
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
