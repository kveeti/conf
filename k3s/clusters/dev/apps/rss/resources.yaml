apiVersion: apps/v1
kind: Deployment
metadata:
  name: rss
  namespace: rss
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rss
  template:
    metadata:
      labels:
        app: rss
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rss
          image: veetik/rss@sha256:d83ea20b62ac0a29d75ea89a515d1e4663973f078c4c5ca5f737ea394762a9bf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOST
              value: 0.0.0.0:8000
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: rss-app
                  key: fqdn-uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full&sslrootcert=/etc/rss/ca.crt
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/rss
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: db-ca
          secret:
            secretName: rss-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: rss
  namespace: rss
spec:
  selector:
    app: rss
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rss
  namespace: rss
spec:
  parentRefs:
    - name: internal-gateway
      namespace: internal-ingress
      sectionName: websecure
  hostnames:
    - rss.internal.veetik.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rss
          port: 80
