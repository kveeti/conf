apiVersion: apps/v1
kind: Deployment
metadata:
  name: money
  namespace: money
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: money
  template:
    metadata:
      labels:
        app: money
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: money
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          image: docker.io/veetik/money@sha256:8ec792d8f1709138084636a7e7f6377597c0eb1785963a7c4bcf6703fa5d1db3
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: IS_PROD
              value: "1"
            - name: DEMO_MODE
              value: "1"
            - name: PORT
              value: "8000"
            - name: BACKEND_URL
              value: https://money.veetik.com
            - name: OIDC_ISSUER
              value: https://auth.veetik.com/realms/main
            - name: OIDC_CLIENT_ID
              value: money
            - name: CLIENT_IP_HEADER
              value: X-Forwarded-For
            - name: ENABLEBANKING_ALLOWED_OIDC_SUBJECTS
              value: 5abe0016-8773-4617-ba7e-3fe6ce892219
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: money-db-app
                  key: fqdn-uri
            - name: DB_URL
              value: $(DATABASE_URI)?sslmode=verify-full&sslrootcert=/etc/money/ca.crt
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: OIDC_CLIENT_SECRET
            - name: ENABLEBANKING_APP_ID
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: ENABLEBANKING_APP_ID
            - name: ENABLEBANKING_PRIVATE_KEY
              value: /run/secrets/enablebanking-private-key
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/money
              readOnly: true
            - name: enablebanking-private-key
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: db-ca
          secret:
            secretName: money-db-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: enablebanking-private-key
          secret:
            secretName: money-secrets
            items:
              - key: enablebanking-private-key
                path: enablebanking-private-key
---
apiVersion: v1
kind: Service
metadata:
  name: money
  namespace: money
spec:
  selector:
    app: money
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: money
  namespace: money
spec:
  parentRefs:
    - name: public-gateway
      namespace: public-ingress
      sectionName: websecure
  hostnames:
    - money.veetik.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: money
          port: 80
