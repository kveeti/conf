apiVersion: v1
kind: ConfigMap
metadata:
  name: bookmarks-config
  namespace: bookmarks
data:
  FRONT_URL: https://bm.veetik.com
  IS_PROD: "true"
  .env: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmarks-backend
  namespace: bookmarks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookmarks-backend
  template:
    metadata:
      labels:
        app: bookmarks-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bookmarks-backend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: docker.io/veetik/bookmarks:backend@sha256:769200adbb782292f44f9490040a59688bb2e28e06cd739871dd7c1d5565d42a
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: bookmarks-db-app
                  key: fqdn-uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full&sslrootcert=/etc/bookmarks/ca.crt
            - name: FRONT_URL
              valueFrom:
                configMapKeyRef:
                  name: bookmarks-config
                  key: FRONT_URL
            - name: IS_PROD
              valueFrom:
                configMapKeyRef:
                  name: bookmarks-config
                  key: IS_PROD
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: bookmarks-secret
                  key: SECRET
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: env-file
              mountPath: /.env
              subPath: .env
              readOnly: true
            - name: db-ca
              mountPath: /etc/bookmarks
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: env-file
          configMap:
            name: bookmarks-config
            items:
              - key: .env
                path: .env
        - name: db-ca
          secret:
            secretName: bookmarks-db-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: bookmarks-backend
  namespace: bookmarks
spec:
  selector:
    app: bookmarks-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmarks-frontend
  namespace: bookmarks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookmarks-frontend
  template:
    metadata:
      labels:
        app: bookmarks-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bookmarks-frontend
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: docker.io/veetik/bookmarks:frontend@sha256:386f04dd8b909d04338dc8404472570012b5520c554a03d044d7051c39194d81
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bookmarks-frontend
  namespace: bookmarks
spec:
  selector:
    app: bookmarks-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookmarks
  namespace: bookmarks
spec:
  parentRefs:
    - name: public-gateway
      namespace: public-ingress
      sectionName: websecure
  hostnames:
    - bm.veetik.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bookmarks-backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bookmarks-frontend
          port: 80
