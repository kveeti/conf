apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-quarkus
          image: quay.io/keycloak/keycloak@sha256:e03b95891c214fba3ab72f12f40c983211549e817c5fce8d0f37761db04ae185
          command: ["/bin/sh", "-c", "cp -r /opt/keycloak/lib/quarkus/. /build/"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: quarkus
              mountPath: /build
      containers:
        - name: keycloak
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: quay.io/keycloak/keycloak@sha256:e03b95891c214fba3ab72f12f40c983211549e817c5fce8d0f37761db04ae185
          args:
            - start
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db-rw.keycloak.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/etc/keycloak/ca.crt
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: password
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME
              value: https://auth.veetik.com
            - name: KC_HOSTNAME_ADMIN
              value: https://authadmin.internal.veetik.com
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: 10.42.0.0/16
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /opt/keycloak/data
            - name: quarkus
              mountPath: /opt/keycloak/lib/quarkus
            - name: db-ca
              mountPath: /etc/keycloak
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: quarkus
          emptyDir:
            sizeLimit: 256Mi
        - name: db-ca
          secret:
            secretName: keycloak-db-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-public
  namespace: keycloak
spec:
  parentRefs:
    - name: public-gateway
      namespace: public-ingress
      sectionName: websecure
  hostnames:
    - auth.veetik.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/main
        - path:
            type: PathPrefix
            value: /resources
      backendRefs:
        - name: keycloak
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  parentRefs:
    - name: internal-gateway
      namespace: internal-ingress
      sectionName: websecure
  hostnames:
    - authadmin.internal.veetik.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-ingress
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: public-gateway
      ports:
        - protocol: TCP
          port: 8080
