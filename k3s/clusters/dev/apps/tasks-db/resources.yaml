apiVersion: v1
kind: Namespace
metadata:
  name: tasks
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage
  namespace: tasks
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tasks-db/
    endpointURL: http://192.168.50.4:3900
    s3Credentials:
      accessKeyId:
        name: tasks-garage
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: tasks-garage
        key: ACCESS_SECRET_KEY
      region:
        name: tasks-garage
        key: REGION
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tasks-db
  namespace: tasks
spec:
  instances: 2
  bootstrap:
    initdb:
      database: tasks
      owner: tasks
      locale: en_US.utf8
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - control1
                  - control2
  storage:
    storageClass: local-path
    size: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        serverName: tasks-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tasks-weekly
  namespace: tasks
spec:
  immediate: true
  schedule: "0 0 4 * * 0"
  backupOwnerReference: cluster
  cluster:
    name: tasks-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: primary
