apiVersion: v1
kind: Namespace
metadata:
  name: public-gateway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-public
  namespace: public-gateway-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: v1.9.2
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    crds:
      enabled: false
    topologyInjector:
      enabled: false
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/public-gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
            watch:
              type: Namespaces
              namespaces:
                - public-gateway-system
                - public-ingress
                - bookmarks
                - keycloak
                - money
                - tasks
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: public-ingress
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      envoyService:
        type: LoadBalancer
        loadBalancerIP: 192.168.50.8
        annotations:
          kube-vip.io/loadbalancerIPs: 192.168.50.8
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Local
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-public
spec:
  controllerName: gateway.envoyproxy.io/public-gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: public
    namespace: public-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: public-ingress
spec:
  gatewayClassName: envoy-public
  listeners:
    - name: web
      hostname: "*.veetik.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      hostname: "*.veetik.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls-keycloak-public
          - name: tls-bookmarks
          - name: tls-money
          - name: tls-tasks
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [bookmarks, keycloak, money, tasks]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-redirect
  namespace: public-ingress
spec:
  parentRefs:
    - name: public-gateway
      sectionName: web
  hostnames:
    - "*.veetik.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
