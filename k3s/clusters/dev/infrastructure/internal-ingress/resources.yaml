apiVersion: v1
kind: Namespace
metadata:
  name: internal-ingress
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: internal-ingress
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: 41.6.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    experimental:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik-internal
    deployment:
      replicas: 2
    ingressClass:
      enabled: false
      name: traefik-internal
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
    service:
      spec:
        type: LoadBalancer
        loadBalancerIP: 192.168.50.9
        allocateLoadBalancerNodePorts: false
