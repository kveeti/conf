apiVersion: v1
kind: Namespace
metadata:
  name: democratic-csi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: democratic-csi
  namespace: flux-system
spec:
  interval: 1h
  url: https://democratic-csi.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 5m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: democratic-csi-ssh
      valuesKey: privateKey
      targetPath: driver.config.sshConnection.privateKey
  values:
    csiDriver:
      name: com.veetik.iscsi
    controller:
      externalSnapshotter:
        enabled: false
      driver:
        image:
          tag: v1.9.5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - control1
                      - control2
    node:
      driver:
        image:
          tag: v1.9.5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - control1
                      - control2
    driver:
      config:
        driver: zfs-generic-iscsi
        sshConnection:
          host: 192.168.50.3
          port: 22
          username: csi
        zfs:
          cli:
            sudoEnabled: true
            paths:
              sudo: /run/wrappers/bin/sudo
              zfs: /run/current-system/sw/bin/zfs
              zpool: /run/current-system/sw/bin/zpool
              chroot: /run/current-system/sw/bin/chroot
          datasetParentName: storage/volumes
          detachedSnapshotsDatasetParentName: storage/snapshots
          zvolEnableReservation: false
        iscsi:
          shareStrategy: targetCli
          shareStrategyTargetCli:
            sudoEnabled: true
            basename: iqn.2026-09.com.veetik:storage
            tpg:
              attributes:
                authentication: 0
                generate_node_acls: 1
                cache_dynamic_acls: 1
                demo_mode_write_protect: 0
          targetPortal: 192.168.50.3
    storageClasses:
      - name: storage-iscsi
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
