apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-mutual-chap
  namespace: democratic-csi
spec:
  interval: 5m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: democratic-csi-ssh
      valuesKey: privateKey
      targetPath: driver.config.sshConnection.privateKey
    - kind: Secret
      name: democratic-csi-mutual-chap
      valuesKey: userid
      targetPath: driver.config.iscsi.shareStrategyTargetCli.tpg.auth.userid
    - kind: Secret
      name: democratic-csi-mutual-chap
      valuesKey: password
      targetPath: driver.config.iscsi.shareStrategyTargetCli.tpg.auth.password
    - kind: Secret
      name: democratic-csi-mutual-chap
      valuesKey: mutual_userid
      targetPath: driver.config.iscsi.shareStrategyTargetCli.tpg.auth.mutual_userid
    - kind: Secret
      name: democratic-csi-mutual-chap
      valuesKey: mutual_password
      targetPath: driver.config.iscsi.shareStrategyTargetCli.tpg.auth.mutual_password
  values:
    csiDriver:
      name: com.veetik.iscsi-mutual-chap
    controller:
      externalSnapshotter:
        enabled: true
      driver:
        image:
          tag: v1.9.5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [control1, control2]
    node:
      driver:
        image:
          tag: v1.9.5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [control1, control2]
    driver:
      config:
        driver: zfs-generic-iscsi
        sshConnection:
          host: 192.168.50.3
          port: 22
          username: csi
        zfs:
          cli:
            sudoEnabled: true
            paths:
              sudo: /run/wrappers/bin/sudo
              zfs: /run/current-system/sw/bin/zfs
              zpool: /run/current-system/sw/bin/zpool
              chroot: /run/current-system/sw/bin/chroot
          datasetParentName: storage/mutual-chap/volumes
          detachedSnapshotsDatasetParentName: storage/mutual-chap/snapshots
          zvolEnableReservation: false
        iscsi:
          shareStrategy: targetCli
          shareStrategyTargetCli:
            sudoEnabled: true
            basename: iqn.2026-09.com.veetik:storage-mutual-chap
            tpg:
              attributes:
                authentication: 1
                generate_node_acls: 1
                cache_dynamic_acls: 1
                demo_mode_write_protect: 0
          targetPortal: 192.168.50.3
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-iscsi-mutual-chap
provisioner: com.veetik.iscsi-mutual-chap
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  fsType: ext4
  csi.storage.k8s.io/node-stage-secret-name: democratic-csi-mutual-chap
  csi.storage.k8s.io/node-stage-secret-namespace: democratic-csi
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: storage-iscsi-mutual-chap
driver: com.veetik.iscsi-mutual-chap
deletionPolicy: Delete
