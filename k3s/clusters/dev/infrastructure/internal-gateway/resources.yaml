apiVersion: v1
kind: Namespace
metadata:
  name: internal-gateway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-internal
  namespace: internal-gateway-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: v1.9.2
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    crds:
      enabled: false
    topologyInjector:
      enabled: false
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/internal-gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
            watch:
              type: Namespaces
              namespaces:
                - internal-gateway-system
                - internal-ingress
                - keycloak
                - radicale
                - rss
                - weather
                - papra
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: internal-ingress
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      envoyService:
        type: LoadBalancer
        loadBalancerIP: 192.168.50.9
        annotations:
          kube-vip.io/loadbalancerIPs: 192.168.50.9
        allocateLoadBalancerNodePorts: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-internal
spec:
  controllerName: gateway.envoyproxy.io/internal-gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: internal
    namespace: internal-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: internal-ingress
spec:
  gatewayClassName: envoy-internal
  listeners:
    - name: web
      hostname: "*.internal.veetik.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      hostname: "*.internal.veetik.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls-keycloak-admin
          - name: tls-radicale
          - name: tls-rss
          - name: tls-weather
          - name: tls-papra
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [keycloak, radicale, rss, weather, papra]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-redirect
  namespace: internal-ingress
spec:
  parentRefs:
    - name: internal-gateway
      sectionName: web
  hostnames:
    - "*.internal.veetik.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
