apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rss-db
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: cnpg
  path: ./k3s/clusters/dev/apps/rss-db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: rss
      namespace: rss
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rss
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: rss-db
    - name: internal-ingress
  path: ./k3s/clusters/dev/apps/rss
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: rss
      namespace: rss
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookmarks-db
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: cnpg
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./k3s/clusters/dev/apps/bookmarks-db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: bookmarks-db
      namespace: bookmarks
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookmarks
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: bookmarks-db
    - name: internal-ingress
    - name: cert-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./k3s/clusters/dev/apps/bookmarks
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bookmarks-backend
      namespace: bookmarks
    - apiVersion: apps/v1
      kind: Deployment
      name: bookmarks-frontend
      namespace: bookmarks
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radicale
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: internal-ingress
    - name: volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./k3s/clusters/dev/apps/radicale
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: radicale
      namespace: radicale
