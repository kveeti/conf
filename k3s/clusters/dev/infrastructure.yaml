  path: ./k3s/clusters/dev/infrastructure/internal-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway-internal
      namespace: internal-gateway-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
