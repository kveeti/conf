  interval: 5m
  dependsOn:
    - name: envoy-gateway
    - name: public-ingress
    - name: cert-manager
  path: ./k3s/clusters/dev/infrastructure/public-gateway
  prune: true
  sourceRef:
    kind: GitRepository
