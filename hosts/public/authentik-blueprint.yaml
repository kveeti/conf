version: 1
metadata:
  name: Homelab identity
entries:
  - model: authentik_core.group
    identifiers:
      name: admins

  - model: authentik_core.group
    identifiers:
      name: internal-users

  - model: authentik_core.group
    identifiers:
      name: rss-users

  - model: authentik_core.group
    identifiers:
      name: paperless-users

  - model: authentik_core.group
    identifiers:
      name: grafana-users

  - model: authentik_core.group
    identifiers:
      name: grafana-admins

  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: google-user-mapping
    identifiers:
      name: Homelab Google user mapping
    attrs:
      expression: |
        return {
          "username": info.get("email"),
          "email": info.get("email"),
          "name": info.get("name"),
        }

  - model: authentik_sources_oauth.oauthsource
    id: google-source
    identifiers:
      slug: google
    attrs:
      name: Google
      enabled: true
      promoted: true
      provider_type: google
      consumer_key: !File /run/agenix/authentik-google-client-id
      consumer_secret: !File /run/agenix/authentik-google-client-secret
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
      user_matching_mode: email_link
      user_property_mappings:
        - !KeyOf google-user-mapping

  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf google-source

  - model: authentik_providers_oauth2.oauth2provider
    id: rss-provider
    identifiers:
      name: RSS
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: rss
      client_secret: !File /run/agenix/oidc-rss-client-secret
      redirect_uris:
        - matching_mode: strict
          url: https://rss.internal.veetik.com/oauth2/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: rss
    attrs:
      name: RSS
      provider: !KeyOf rss-provider

  - model: authentik_providers_oauth2.oauth2provider
    id: paperless-provider
    identifiers:
      name: Paperless
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: paperless
      client_secret: !File /run/agenix/oidc-paperless-client-secret
      redirect_uris:
        - matching_mode: strict
          url: https://p.internal.veetik.com/accounts/oidc/authentik/login/callback/
        - matching_mode: strict
          url: https://p.internal.veetik.com/oauth2/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: paperless
    attrs:
      name: Paperless
      provider: !KeyOf paperless-provider

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !File /run/agenix/oidc-grafana-client-secret
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.internal.veetik.com/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider

  - model: authentik_providers_oauth2.oauth2provider
    id: money-provider
    identifiers:
      name: Money
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: money
      client_secret: !File /run/agenix/oidc-money-client-secret
      redirect_uris:
        - matching_mode: strict
          url: https://money.veetik.com/api/v1/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: money
    attrs:
      name: Money
      provider: !KeyOf money-provider
